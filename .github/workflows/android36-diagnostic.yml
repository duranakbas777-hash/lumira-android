name: Lumira Native Build Diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare project
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/build.gradle.kts','app/build.gradle'):
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              s=s.replace('compileSdk = 37','compileSdk = 36').replace('compileSdk 37','compileSdk 36')
              s=s.replace('targetSdk = 37','targetSdk = 36').replace('targetSdk 37','targetSdk 36')
              p.write_text(s)
          PY
          mkdir -p app/src/main/res/drawable-nodpi
          if [ -s ci/lumi-mark.b64 ]; then
            base64 --decode ci/lumi-mark.b64 > app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
          fi
          if grep -R -n -E 'android\.webkit|\bWebView\b|loadUrl\(|addJavascriptInterface\(' app/src/main --include='*.kt' --include='*.java'; then
            echo 'WEBVIEW_FOUND' > native-check.txt
            exit 9
          else
            echo 'NATIVE_ONLY_OK' > native-check.txt
          fi

      - name: Build and capture full log
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace 2>&1 | tee build.log
          else
            gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee build.log
          fi

      - name: Publish diagnostic log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f build.log || echo 'Build did not reach Gradle.' > build.log
          cp native-check.txt native-check.txt 2>/dev/null || true
          if ! gh release view build-diagnostics >/dev/null 2>&1; then
            gh release create build-diagnostics --prerelease --title 'Lumira build diagnostics' --notes 'Automated native Android build diagnostics.'
          fi
          gh release upload build-diagnostics build.log --clobber
          if [ -f native-check.txt ]; then gh release upload build-diagnostics native-check.txt --clobber; fi

      - name: Publish APK when build succeeded
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" Lumira-Native-v2.0.0-alpha1.apk
          sha256sum Lumira-Native-v2.0.0-alpha1.apk > Lumira-Native-v2.0.0-alpha1.sha256
          if ! gh release view v2.0.0-alpha1 >/dev/null 2>&1; then
            gh release create v2.0.0-alpha1 --prerelease --title 'Lumira Native 2.0.0 alpha1' --notes 'İlk WebView içermeyen native Android test sürümü.'
          fi
          gh release upload v2.0.0-alpha1 Lumira-Native-v2.0.0-alpha1.apk Lumira-Native-v2.0.0-alpha1.sha256 --clobber

      - name: Fail workflow if Gradle failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: exit 1
