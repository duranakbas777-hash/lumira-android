name: Lumira Native Android 36 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native Android project
        shell: bash
        run: |
          set -euo pipefail
          test -d ci/payload
          cat ci/payload/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/lumira-native.zip
          unzip -t /tmp/lumira-native.zip
          unzip -q -o /tmp/lumira-native.zip -d .
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Native project restored."
          find . -maxdepth 2 -type f | sort | head -80

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Pin project to Android 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/build.gradle.kts','app/build.gradle'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text()
              s=s.replace('compileSdk = 37','compileSdk = 36').replace('compileSdk 37','compileSdk 36')
              s=s.replace('targetSdk = 37','targetSdk = 36').replace('targetSdk 37','targetSdk 36')
              p.write_text(s)
              print(p.read_text())
          PY

      - name: Restore exact Lumi mark if bundled
        shell: bash
        run: |
          if [ -f ci/lumi-mark.b64 ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            base64 --decode ci/lumi-mark.b64 > app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
            file app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
            sha256sum app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
          fi

      - name: Verify no WebView source
        shell: bash
        run: |
          if grep -R -n -E 'android\.webkit|\bWebView\b|loadUrl\(|addJavascriptInterface\(' app/src/main --include='*.kt' --include='*.java'; then
            echo 'WebView code found; refusing native build.' >&2
            exit 1
          fi

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" out/Lumira-Native-v2.0.0-alpha1.apk
          sha256sum out/Lumira-Native-v2.0.0-alpha1.apk | tee out/SHA256.txt
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumira-native-apk
          path: out/
          if-no-files-found: error
          retention-days: 14
