name: Lumira Native APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Pin Android API level to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/build.gradle.kts','app/build.gradle'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              for old,new in [
                  ('compileSdk = 37','compileSdk = 36'),
                  ('compileSdk 37','compileSdk 36'),
                  ('targetSdk = 37','targetSdk = 36'),
                  ('targetSdk 37','targetSdk 36'),
              ]:
                  s = s.replace(old,new)
              p.write_text(s)
          PY

      - name: Restore exact Lumi artwork
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if [ -s ci/lumi-mark.b64 ]; then
            base64 --decode ci/lumi-mark.b64 > app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
          else
            for url in \
              'https://lumira.watch/wp-content/themes/lumira-watch/assets/images/lumira-lumi-mark.png' \
              'https://lumira.watch/wp-content/themes/lumira/assets/images/lumira-lumi-mark.png'; do
              if curl -fL --connect-timeout 8 --max-time 20 "$url" -o /tmp/lumi.png; then
                cp /tmp/lumi.png app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
                break
              fi
            done
          fi
          if [ -s app/src/main/res/drawable-nodpi/lumira_lumi_mark.png ]; then
            file app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
            sha256sum app/src/main/res/drawable-nodpi/lumira_lumi_mark.png
            grep -RIl 'R\.drawable\.ic_lumi' app/src/main --include='*.kt' --include='*.java' | xargs -r sed -i 's/R\.drawable\.ic_lumi/R.drawable.lumira_lumi_mark/g'
          fi

      - name: Verify native-only source
        shell: bash
        run: |
          if grep -R -n -E 'android\.webkit|\bWebView\b|loadUrl\(|addJavascriptInterface\(' app/src/main --include='*.kt' --include='*.java'; then
            echo 'WebView code found; refusing build.' >&2
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" dist/Lumira-Native-v2.0.0-alpha1.apk
          sha256sum dist/Lumira-Native-v2.0.0-alpha1.apk > dist/Lumira-Native-v2.0.0-alpha1.sha256
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumira-native-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish alpha APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v2.0.0-alpha1 >/dev/null 2>&1; then
            gh release create v2.0.0-alpha1 --prerelease --title 'Lumira Native 2.0.0 alpha1' --notes 'İlk WebView içermeyen native Android test sürümü.'
          fi
          gh release upload v2.0.0-alpha1 dist/Lumira-Native-v2.0.0-alpha1.apk dist/Lumira-Native-v2.0.0-alpha1.sha256 --clobber
