name: Build Lumira APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native Android project
        shell: bash
        run: |
          cat ci/payload/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/lumira-project.zip
          unzip -q -o /tmp/lumira-project.zip -d .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          if grep -R -n -E 'android\.webkit|WebView|loadUrl\(|addJavascriptInterface' app/src/main/java; then
            echo 'WebView code detected; refusing native build.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build native debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lumira-v2.0.0-alpha1.apk
          sha256sum Lumira-v2.0.0-alpha1.apk
          ls -lh Lumira-v2.0.0-alpha1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumira-v2.0.0-alpha1-apk
          path: Lumira-v2.0.0-alpha1.apk
          if-no-files-found: error
